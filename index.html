    <script>
      (function(){
        var t=localStorage.getItem("spec-theme")||"dark";
        document.documentElement.setAttribute("data-theme",t);
        var l=document.getElementById("loader");
        var lt=document.getElementById("loader-text");
        if(l){
          l.style.background=t==="light"?"#E4E5E2":"#111315";
          if(lt)lt.style.color=t==="light"?"#9C9E9B":"#6B6E6C";
        }
      })();
    </script>

    <div id="loader" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #111315;
    ">
      <img src="/logo.png" alt="" style="height: 120px; object-fit: contain; opacity: 0.9;" />
      <span id="loader-text" style="
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
        color: #6B6E6C;
