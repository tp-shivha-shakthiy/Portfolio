<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the site uses: Literata 400 · Inter 400/500 + italic 400 · JetBrains Mono 400/500 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400&family=Inter:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Hero portrait is the largest above-the-fold image: fetch it early -->
    <link rel="preload" as="image" href="/portrait.webp" type="image/webp" fetchpriority="high" />
    <!-- Loader colours follow the saved theme (the theme script below runs before <body> exists) -->
    <style>
      #loader { background: #111315; }
      #loader-text { color: #8A8D8A; }
      [data-theme="light"] #loader { background: #F5F3EE; }
      [data-theme="light"] #loader-text { color: #65635E; }
    </style>

    <!-- Primary -->
    <title>T P Shivha Shakthiy — ML Systems & Full-Stack Development</title>
    <meta name="description" content="CS undergraduate at IIIT Kottayam building ML systems, cybersecurity AI, and full-stack applications. Projects in intrusion detection, cross-modal ReID, and AI-powered platforms." />

    <!-- Open Graph -->
    <meta property="og:title" content="T P Shivha Shakthiy — ML Systems & Full-Stack Development" />
    <meta property="og:description" content="CS undergraduate at IIIT Kottayam building ML systems, cybersecurity AI, and full-stack applications." />
    <meta property="og:url" content="https://tp-shivha-shakthiy.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="T P Shivha Shakthiy — ML Systems & Full-Stack Development" />
    <meta name="twitter:description" content="CS undergraduate at IIIT Kottayam building ML systems, cybersecurity AI, and full-stack applications." />
    <script>
      (function(){
        var t=localStorage.getItem("spec-theme")||"dark";
        document.documentElement.setAttribute("data-theme",t);
      })();
    </script>
  </head>
  <body>
    <div id="loader" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    ">
      <img src="/logo-240.png" alt="" width="120" height="120" style="object-fit: contain; opacity: 0.9;" />
      <span id="loader-text" style="
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      ">Loading...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
